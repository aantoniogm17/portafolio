<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Antonio García Morán — Desarrollador de software</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portafolio de Antonio García Morán, desarrollador de software en Tampico, México. Angular, C#, SQL Server, AWS y Firebase." />
    <meta name="theme-color" content="#0b0f1a" />

    <!-- Open Graph: controla cómo se ve el enlace cuando lo compartes en
         LinkedIn o WhatsApp. Sin esto, la vista previa sale vacía. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Antonio García Morán — Desarrollador de software" />
    <meta
      property="og:description"
      content="Ingeniero en Sistemas Computacionales. Angular, C#, SQL Server, AWS y Firebase." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- preconnect antes de cargar las fuentes: ahorra el tiempo de la
         negociación TLS con Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" />

    <!-- Datos estructurados: le dice a Google que esta página describe a una
         persona, no a un producto. Mejora cómo aparece en resultados. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Antonio García Morán",
        "jobTitle": "Software Developer",
        "email": "aantoniogm17@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Tampico",
          "addressRegion": "Tamaulipas",
          "addressCountry": "MX"
        },
        "alumniOf": "Instituto Tecnológico de Ciudad Madero",
        "knowsLanguage": ["es", "en"]
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
